
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  >

  <title>Unity Web Player | 豆でオセロしてみた！</title>

  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <link rel="stylesheet" href="TemplateData/style.css">
</head>

<body>
  <div id="unity-container" class="unity-desktop">

    <div id="unity-fullscreen-container">
      <canvas
        id="unity-canvas"
        width="1080"
        height="1920"
        tabindex="-1">
      </canvas>

      <div id="unity-loading-container">
        <div id="unity-loading-bar">
          <div id="unity-logo"></div>
          <div id="unity-progress-bar-empty">
            <div id="unity-progress-bar-full"></div>
          </div>
        </div>
      </div>
    </div>

    <div id="unity-warning"></div>

    <div id="unity-footer">
      <div id="unity-logo-title-footer"></div>
      <div id="unity-fullscreen-button"></div>
      <div id="unity-build-title">豆でオセロしてみた！</div>
    </div>
  </div>

  <script>
    "use strict";

    const canvas =
      document.querySelector("#unity-canvas");

    const unityContainer =
      document.querySelector("#unity-container");

    const fullscreenContainer =
      document.querySelector("#unity-fullscreen-container");

    const loadingContainer =
      document.querySelector("#unity-loading-container");

    const progressBarFull =
      document.querySelector("#unity-progress-bar-full");

    const warningBanner =
      document.querySelector("#unity-warning");


    // ブラウザの表示領域に合わせる
    function resizeUnityGame() {
      unityContainer.style.width = "100%";
      unityContainer.style.height = "100%";

      fullscreenContainer.style.width = "100%";
      fullscreenContainer.style.height = "100%";

      canvas.style.width = "100%";
      canvas.style.height = "100%";
    }

    window.addEventListener("resize", resizeUnityGame);
    window.addEventListener("orientationchange", resizeUnityGame);

    if (window.visualViewport) {
      window.visualViewport.addEventListener(
        "resize",
        resizeUnityGame
      );
    }

    resizeUnityGame();


    // Unity警告・エラー表示
    function unityShowBanner(msg, type) {
      function updateBannerVisibility() {
        warningBanner.style.display =
          warningBanner.children.length ? "block" : "none";
      }

      const div = document.createElement("div");
      div.textContent = msg;
      warningBanner.appendChild(div);

      if (type === "error") {
        div.style.cssText =
          "background:red;color:white;padding:10px;";
      } else {
        if (type === "warning") {
          div.style.cssText =
            "background:yellow;color:black;padding:10px;";
        }

        setTimeout(() => {
          if (div.parentNode) {
            div.remove();
          }
          updateBannerVisibility();
        }, 5000);
      }

      updateBannerVisibility();
    }


    // Unity WebGLビルド設定
    const buildUrl = "Build";

    const loaderUrl =
      buildUrl + "/オセロコーヒー.loader.js";

    const config = {
      arguments: [],

      dataUrl:
        buildUrl + "/オセロコーヒー.data.unityweb",

      frameworkUrl:
        buildUrl + "/オセロコーヒー.framework.js.unityweb",

      codeUrl:
        buildUrl + "/オセロコーヒー.wasm.unityweb",

      streamingAssetsUrl: "StreamingAssets",

      fullscreenElementID: "unity-fullscreen-container",

      companyName: "DefaultCompany",
      productName: "豆でオセロしてみた！",
      productVersion: "1.0",

      showBanner: unityShowBanner
    };


    // 描画解像度はUnity標準のまま
    // devicePixelRatioの制限なし
    // matchWebGLToCanvasSizeの変更なし


    // スマホ・タブレット判定
    if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
      unityContainer.className = "unity-mobile";
      canvas.className = "unity-mobile";
    }


    // Unity読み込み
    const script = document.createElement("script");
    script.src = loaderUrl;

    script.onload = () => {
      createUnityInstance(
        canvas,
        config,
        (progress) => {
          if (progress < 1) {
            loadingContainer.style.display = "block";
            progressBarFull.style.width =
              (100 * progress) + "%";
          } else {
            loadingContainer.style.display = "none";
          }
        }
      ).then((unityInstance) => {
        loadingContainer.style.display = "none";
        resizeUnityGame();

        const fullscreenButton =
          document.querySelector("#unity-fullscreen-button");

        if (fullscreenButton) {
          fullscreenButton.onclick = () => {
            unityInstance.SetFullscreen(1);
          };
        }

        document.addEventListener(
          "fullscreenchange",
          resizeUnityGame
        );
      }).catch((message) => {
        unityShowBanner(String(message), "error");
      });
    };

    script.onerror = () => {
      unityShowBanner(
        "Unityの読み込みに失敗しました。",
        "error"
      );
    };

    document.body.appendChild(script);
  </script>
</body>
</html>
